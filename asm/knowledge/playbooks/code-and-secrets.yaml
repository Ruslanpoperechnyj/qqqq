# Материалы заказчика: код, репозиторий, образ контейнера.
# Эти действия объект не трогают вовсе — они читают то, что передано по договору.

- id: code-provided
  title: Передан код или репозиторий заказчика
  match:
    product: [repo, git, source]
  steps:
    - action: check_secrets
      why: ключи и пароли в коде — самый короткий путь к доступу
    - action: check_code
      why: статический анализ на инъекции и опасные вызовы

- id: image-provided
  title: Передан образ контейнера
  match:
    product: [docker, container, image]
  steps:
    - action: check_image
      why: уязвимые пакеты внутри образа
    - action: check_secrets
      why: секреты, запечённые в слои
